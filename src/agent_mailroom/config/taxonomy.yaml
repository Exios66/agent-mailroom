# Agent Mailroom taxonomy — config over code.
# Aligned to llm-mailroom v0.6.0 (pared LLM load + severity-aware gates).

pipeline:
  bins:
    inbox: "{base_dir}/pipeline/inbox"
    processing: "{base_dir}/pipeline/processing"
    classified: "{base_dir}/pipeline/classified"
    review: "{base_dir}/pipeline/review"
    failed: "{base_dir}/pipeline/failed"
    archive: "{base_dir}/archive"
    manifests: "{base_dir}/manifests"
    hive: "{base_dir}/hive"

# Global fallbacks (used before doc_type is known). Per-class severity overrides
# under by_class win once classification is set — see loader.confidence().
confidence:
  high: 0.97
  low: 0.88
  retry_max: 2
  # Lane B: low <= extraction_confidence < judge_band_high fires judge_verify.
  # Clean high-confidence extractions skip (happy-path LLM count = 2).
  judge_band_high: 0.95
  arbiter_retry_max: 2
  judge_max_passes: 3
  conflict_threshold: 0.3
  by_class:
    contract:
      high: 0.98
      low: 0.90
      judge_band_high: 0.97
    merger_agreement:
      high: 0.98
      low: 0.90
      judge_band_high: 0.97
    insurance_claim:
      high: 0.98
      low: 0.90
      judge_band_high: 0.97
    compliance_filing:
      high: 0.97
      low: 0.88
      judge_band_high: 0.95
    corporate_record:
      high: 0.96
      low: 0.86
      judge_band_high: 0.94
    correspondence:
      high: 0.95
      low: 0.85
      judge_band_high: 0.92

file_extensions:
  - .txt
  - .md
  - .pdf
  - .docx

doc_classes:
  - key: contract
    label: Contract
    schema: ContractExtraction
    specialist: contracts_specialist
    stamp: "#7d97b5"
    subclasses: [nda, msa, lease, employment, services, license]
  - key: merger_agreement
    label: Merger Agreement
    schema: ContractExtraction
    specialist: contracts_specialist
    stamp: "#8aa3c0"
    subclasses: [stock_purchase, asset_purchase, merger]
  - key: corporate_record
    label: Corporate Record
    schema: CorporateRecordExtraction
    specialist: corporate_records_specialist
    stamp: "#659099"
    subclasses: [bylaws, resolution, consent, charter]
  - key: correspondence
    label: Correspondence
    schema: CorrespondenceExtraction
    specialist: correspondence_specialist
    stamp: "#e8b478"
    subclasses: [demand_letter, memo, notice, engagement_letter]
  - key: compliance_filing
    label: Compliance Filing
    schema: ComplianceFilingExtraction
    specialist: compliance_specialist
    stamp: "#7a8fb0"
    subclasses: [10-k, 10-q, 8-k, state_filing]
  - key: insurance_claim
    label: Insurance Claim
    schema: InsuranceClaimExtraction
    specialist: insurance_claims_specialist
    stamp: "#b18ec2"
    subclasses: [property, liability, workers_comp, denial]

# Office-floor roster. character ids are original procedural sprites.
# Optional per-agent harness: provider / model (else OpenRouter defaults).
agents:
  sorter:
    label: Sorter
    role: classify
    desk: desk-reception
    character: pam
    room: reception
  sorter_reviewer:
    label: Sorter Reviewer
    role: review-classify
    desk: desk-reception-2
    character: kelly
    room: reception
  contracts_specialist:
    label: Contracts
    role: extract
    desk: desk-contracts
    character: dwight
    room: bay-a
  corporate_records_specialist:
    label: Corporate Records
    role: extract
    desk: desk-corporate
    character: angela
    room: bay-a
  correspondence_specialist:
    label: Correspondence
    role: extract
    desk: desk-correspondence
    character: jim
    room: bay-b
  compliance_specialist:
    label: Compliance
    role: extract
    desk: desk-compliance
    character: toby
    room: bay-b
  insurance_claims_specialist:
    label: Insurance Claims
    role: extract
    desk: desk-claims
    character: meredith
    room: bay-b
  judge:
    label: Judge
    role: evaluate
    desk: desk-judge
    character: oscar
    room: judge
  arbiter:
    label: Arbiter
    role: adjudicate
    desk: desk-arbiter
    character: stanley
    room: judge
  boss:
    label: Boss
    role: adjudicate
    desk: desk-boss
    character: michael
    room: boss
    god: true
  # Reporter is procedural (no LLM) as of llm-mailroom v0.6.0.
  reporter:
    label: Reporter
    role: report
    desk: desk-report
    character: ryan
    room: report
    procedural: true
  archivist:
    label: Archivist
    role: archive
    desk: desk-archive
    character: creed
    room: archive

# Speech-act colors for flying envelopes.
hive_acts:
  request: "#4F9FAF"
  query: "#9482D3"
  propose: "#DCAB3C"
  inform: "#FFF8E7"
  agree: "#5CA97A"
  done: "#5CA97A"
  refuse: "#D96A62"

vision:
  enabled: true
  max_pages: 10
  dpi: 150
  models:
    - qwen
    - gpt-4o
    - gemini
    - claude-3

field_scoring:
  ambiguous_band: [0.55, 0.85]
  embedding_enabled: false
