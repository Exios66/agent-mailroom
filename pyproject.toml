[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mailroom"
version = "0.2.0"
description = "The Mailroom — llm-mailroom v0.6.0 pipeline on a walking office floor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Mailroom contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Same pin as llm-mailroom v0.6.0 (KANBAN-061 shim over shared engine).
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.12.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
vision = ["pymupdf>=1.24"]
observability = ["langfuse>=3.0"]
phoenix = ["arize-phoenix>=4.0"]
tui = ["rich>=13.0"]
auth = ["pyjwt>=2.8", "bcrypt>=4.0"]
# Optional embedding cosine rescue + Hungarian matcher used by dojo scoring.
embeddings = [
    "scipy>=1.10",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
agent-mailroom = "agent_mailroom.__main__:main"
mailroom-tui = "agent_mailroom.tui.mailroom_console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_mailroom = ["config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# Monorepo dev: resolve the shared scoring engine from the workspace instead
# of the release git pin above. Plain `pip install .` keeps using the pin.
[tool.uv.sources]
llm-dojo-scoring = { workspace = true }
